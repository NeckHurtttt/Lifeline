<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventana de Lanzamiento</title>
  <link rel="stylesheet" href="styles/console.css">
  <link rel="stylesheet" href="styles/terminal.css">
</head>
<body>
  <header id="barra">
    <span class="logo">◢ VENTANA DE LANZAMIENTO</span>
    <span id="barra-info"></span>
    <button id="idioma" title="Español / English">ES | EN</button>
    <button id="silencio" title="Silenciar sonido">SONIDO: SÍ</button>
    <button id="musica" title="Música original (CC0)">MÚSICA: NO</button>
    <button id="glosario" title="Glosario: palabras del espacio">📖</button>
    <button id="letra-menos" title="Letra más chica">A−</button>
    <button id="letra-mas" title="Letra más grande (para proyectar)">A+</button>
    <button id="daltonico" title="Colores para daltonismo">👁️</button>
  </header>
  <main id="app"></main>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
