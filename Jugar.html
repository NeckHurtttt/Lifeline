ome from an event: if they aren't repaired by hand before the deadline, they get worse.","AVERÍAS: {0}":"FAULTS: {0}","vence hoy":"due today","{0} día":"{0} day","Avería: plazo {0}":"Fault: deadline {0}","PARCHE ({0} ░)":"PATCH ({0} ░)","Muro de regolito: {0}/{1}{2} · Regolito guardado para parches: {3}":"Regolith wall: {0}/{1}{2} · Regolith stored for patches: {3}","Material guardado: +{0} L de agua, +{1} piezas, +{2} de ciencia, muro {3}/{4}, +{5} de regolito guardado ({6} en total).":"Material stored: +{0} L of water, +{1} parts, +{2} science, wall {3}/{4}, +{5} regolith stored ({6} total).","Usar lo que hay en el lugar":"Using what's on site","En la Luna y Marte se piensa sacar agua del hielo y hacer muros y piezas con el suelo (regolito) para no subirlo todo desde la Tierra.":"On the Moon and Mars the plan is to get water from ice and make walls and parts from the soil (regolith) instead of launching everything from Earth.","Construir con materiales del lugar, como el adobe o la tierra compactada, ahorra transporte y es una forma de construir barata y sostenible.":"Building with local materials, like adobe or rammed earth, saves transport and is a cheap, sustainable way to build.","Reparar siguiendo el procedimiento":"Repairing by the procedure","En la estación cada arreglo sigue una lista de pasos escrita y probada en la Tierra: un paso fuera de orden puede ser peligroso.":"On the station every fix follows a written checklist tested on Earth: a step out of order can be dangerous.","Pilotos, médicos y técnicos usan listas de verificación para no olvidar pasos: está comprobado que evitan accidentes y errores.":"Pilots, doctors and technicians use checklists so they don't skip steps: they are proven to prevent accidents and mistakes.","No se pudo cargar la conexión (¿hay internet?)":"Couldn't load the connection (is there internet?)",Anfitrión:"Host",Jugador:"Player","Sin conexión con el directorio; la sala sigue para quien ya entró.":"Lost the directory connection; the room still works for those already in.","Sala {0} abierta. Comparte el código.":"Room {0} open. Share the code.","No se pudo abrir la sala. Prueba otra vez.":"Couldn't open the room. Try again.","El código tiene 6 letras o números.":"The code has 6 letters or numbers.","No se pudo conectar: {0}":"Couldn't connect: {0}","La sala no responde. Revisa el código.":"The room isn't answering. Check the code.","No existe una sala con ese código.":"There's no room with that code.","Error: {0}":"Error: {0}","La sala está llena (máximo 4).":"The room is full (max 4).","El anfitrión cerró la sala.":"The host closed the room.","Conectado a la sala {0}.":"Connected to room {0}.","MÚSICA: SÍ":"MUSIC: ON","MÚSICA: NO":"MUSIC: OFF","EVA DE EXCAVACIÓN":"DIGGING EVA","Salen dos con el traje. A / D caminan, S excava hacia abajo y un clic en un bloque vecino lo excava. Con B cambias a construir: un clic en un hueco vecino pone regolito (escalón o techo). Vuelvan a la esclusa antes de que se acabe el oxígeno.":"Two go out in suits. A / D walk, S digs down and tapping a nearby block digs it. B switches to build: tapping a nearby gap places regolith (a step or a roof). Get back to the airlock before the oxygen runs out.","Muro de regolito: {0}/{1}{2}":"Regolith wall: {0}/{1}{2}","Elige a los dos que salen:":"Choose the two who go out:"," {0} (salud {1}, cansancio {2})":" {0} (health {1}, fatigue {2})","GO: pareja, descansados, sin tormenta solar.":"GO: in pairs, rested, no solar storm.","SALIR POR LA ESCLUSA":"EXIT THROUGH THE AIRLOCK","AFUERA: {0}":"OUTSIDE: {0}","O₂ DEL TRAJE {0}":"SUIT O₂ {0}","[B] CONSTRUIR":"[B] BUILD","[B] EXCAVAR":"[B] DIG","BOLSA: regolito {0} · hielo {1} · hierro {2} · rocas raras {3}  →  +{4} L agua, +{5} piezas, +{6} ciencia":"BAG: regolith {0} · ice {1} · iron {2} · rare rocks {3}  →  +{4} L water, +{5} parts, +{6} science","S excavar abajo":"S dig down","ENTRAR POR LA ESCLUSA":"ENTER THROUGH THE AIRLOCK","REGRESO DE EMERGENCIA (pierde la mitad)":"EMERGENCY RETURN (lose half)","RECORRIDO DE LA BASE":"BASE WALKTHROUGH","Camina con A / D o las flechas. En un módulo gastado o roto pulsa E para repararlo a mano: el procedimiento está en el panel, sin azar. ":"Walk with A / D or the arrows. At a worn or broken module press E to repair it by hand: the procedure is on the panel, no luck involved. ","Reparaciones a mano hoy: {0}/{1}. Cada una usa 1 pieza.":"Hands-on repairs today: {0}/{1}. Each one uses 1 part."," · APAGADO":" · OFF","[E] REPARAR":"[E] REPAIR",CONFIRMAR:"CONFIRM","El módulo {0} está muy dañado. Pon a alguien en 🔧 Reparación o repáralo a mano en Recorrido.":"The {0} module is badly damaged. Put someone on 🔧 Repair or fix it by hand in Walkthrough.",Recorrido:"Walkthrough",Excavar:"Dig","Conectando...":"Connecting...","EN LÍNEA: CADA UNO DESDE SU COMPU":"ONLINE: EACH ON THEIR OWN DEVICE","De 2 a 4 personas, cada una en su navegador. Quien crea la sala comparte el código de 6 letras; las demás lo escriben. Los roles se reparten como arriba y todos ven la misma misión. Necesita internet.":"2 to 4 people, each in their own browser. Whoever creates the room shares the 6-letter code; the others type it. Roles are split as above and everyone sees the same mission. Needs internet.","SALA {0}":"ROOM {0}","Eres el anfitrión: deja esta pestaña abierta.":"You're the host: keep this tab open.","Conectado como invitado.":"Connected as a guest.","En la sala: ":"In the room: ","SALIR DE LA SALA":"LEAVE ROOM","Tu nombre":"Your name","CREAR SALA":"CREATE ROOM",CÓDIGO:"CODE",UNIRSE:"JOIN","Estás en la sala de otra persona: el anfitrión empieza la misión y tu pantalla lo sigue.":"You're in someone else's room: the host starts the mission and your screen follows.",Regreso:"Return",EVA:"EVA",GO:"GO","NO GO":"NO GO",sueño:"sleep","Reciclaje de agua":"Water recycling","En la estación se recupera cerca del 98 % del agua, incluida la humedad del aire y la orina, porque subir agua cuesta una fortuna.":"On the station about 98% of the water is recovered, including air humidity and urine, because launching water costs a fortune.","Las mismas ideas de reutilización y tratamiento ayudan a ciudades y zonas con sequía a no depender solo de lluvia o ríos.":"The same reuse and treatment ideas help cities and drought areas not depend only on rain or rivers.","Los paneles de la estación alimentan todo a bordo, pero se apagan en cada eclipse, unos 45 minutos de cada 90.":"The station's panels power everything on board, but they go dark in every eclipse, about 45 minutes out of every 90.","La energía solar abarata la luz en lugares aislados; los avances en celdas para el espacio mejoraron su eficiencia en casa.":"Solar power makes electricity cheaper in remote places; advances in space solar cells improved their efficiency at home.","Las baterías guardan la energía del lado iluminado para pasar el eclipse sin apagar el soporte vital.":"Batteries store energy from the sunlit side to get through the eclipse without shutting down life support.","Almacenar energía permite usar sol y viento de noche o sin viento, y mantener hospitales con luz en apagones.":"Storing energy lets us use sun and wind at night or when there's no wind, and keeps hospitals lit during blackouts.",Racionamiento:"Rationing","Con suministros limitados, la tripulación calcula consumos diarios de agua, comida y oxígeno y ajusta antes de quedarse corta.":"With limited supplies, the crew calculates daily water, food and oxygen use and adjusts before running short.","Planificar y medir el consumo ayuda a hogares y comunidades a sobrevivir sequías, escasez y emergencias.":"Planning and measuring consumption helps homes and communities get through droughts, shortages and emergencies.","Ejercicio y huesos":"Exercise and bones","Sin gravedad los huesos y músculos se debilitan, así que se entrena unas 2 horas al día con máquinas especiales.":"Without gravity, bones and muscles weaken, so astronauts train about 2 hours a day on special machines.","Lo aprendido sobre pérdida ósea sirve para entender la osteoporosis y la recuperación de personas con poco movimiento.":"What we learned about bone loss helps us understand osteoporosis and the recovery of people who can't move much.","Radiación y protector solar":"Radiation and sunscreen","Fuera de la protección de la atmósfera la radiación se acumula, y por eso se vigila la dosis de cada persona. Medidas reales: unos 0,5 mSv por día en la estación, 1,4 en la superficie de la Luna (sonda Chang'E-4) y 0,64 en Marte (rover Curiosity). NASA pone un límite de 600 mSv en toda la carrera de un astronauta.":"Outside the atmosphere's protection, radiation adds up, so each person's dose is tracked. Real measurements: about 0.5 mSv per day on the station, 1.4 on the Moon's surface (Chang'E-4 lander) and 0.64 on Mars (Curiosity rover). NASA sets a 600 mSv limit for an astronaut's whole career.","En la Tierra el protector solar, la sombra y evitar el sol fuerte reducen el daño de la radiación ultravioleta en la piel.":"On Earth, sunscreen, shade and avoiding strong sun reduce ultraviolet damage to the skin.","Purificadores de aire":"Air purifiers","Se retira el CO₂ que exhala la tripulación y se repone oxígeno, o todos se intoxicarían en cuarto cerrado.":"The CO₂ the crew breathes out is removed and oxygen is added back, or everyone would be poisoned in a closed room.","Filtrar y ventilar mejora el aire de aulas, oficinas y hospitales, donde el CO₂ alto da sueño y falta de concentración.":"Filtering and ventilating improve the air in classrooms, offices and hospitals, where high CO₂ causes sleepiness and poor focus.","Satélites y clima":"Satellites and weather","Las cámaras e instrumentos en órbita observan nubes, océanos y hielo de todo el planeta de forma continua.":"Cameras and instruments in orbit continuously watch clouds, oceans and ice across the whole planet.","Esos datos alimentan los pronósticos, alertas de huracanes e incendios y el seguimiento del cambio climático.":"That data feeds weather forecasts, hurricane and wildfire alerts and climate change tracking.",GPS:"GPS","Una constelación de satélites con relojes muy precisos permite calcular la posición desde cualquier punto.":"A constellation of satellites with very precise clocks lets you calculate your position from anywhere.","El GPS guía vehículos, barcos y aviones, ayuda a rescates y sincroniza redes eléctricas y bancos.":"GPS guides cars, ships and planes, helps rescues and synchronizes power grids and banks.","Trabajo en equipo: Go/No-Go":"Teamwork: Go/No-Go","Antes de un lanzamiento cada responsable dice Go o No-Go; si una sola persona ve un riesgo, se detiene.":"Before a launch, each lead says Go or No-Go; if a single person sees a risk, it stops.","Las listas de verificación y dar voz a todos reducen errores en cirugías, aviación y obras.":"Checklists and giving everyone a voice reduce errors in surgery, aviation and construction.","Filtros de agua portátiles":"Portable water filters","Los sistemas compactos de filtrado se diseñaron para dar agua segura con poco peso y poco mantenimiento.":"Compact filtering systems were designed to provide safe water with little weight and little maintenance.","Filtros portátiles similares dan agua potable tras desastres y en comunidades sin red de agua limpia.":"Similar portable filters provide drinking water after disasters and in communities without clean water networks.","Escudo térmico":"Heat shield","Al reentrar, la cápsula soporta miles de grados gracias a materiales que se desgastan y se llevan el calor.":"During reentry, the capsule withstands thousands of degrees thanks to materials that wear away and carry the heat off.","Los materiales aislantes y resistentes al fuego nacidos de esa investigación se usan en trajes de bomberos y aislamiento de edificios.":"Insulating, fire-resistant materials born from that research are used in firefighter suits and building insulation.","La noche lunar":"The lunar night","En la Luna la noche dura hasta 14 días y baja a −170 °C: sin sol, la base vive de baterías, pilas regenerativas o un reactor pequeño.":"On the Moon, night lasts up to 14 days and drops to −170 °C: with no sun, the base runs on batteries, regenerative fuel cells or a small reactor.","Guardar energía para muchos días ayuda a pueblos aislados y hospitales a no quedarse sin luz en invierno o en apagones largos.":"Storing energy for many days helps remote towns and hospitals keep the lights on in winter or during long blackouts.","Agua en el hielo":"Water in the ice","En los cráteres del polo sur lunar y bajo el suelo de Marte hay hielo: usarlo evita subir agua desde la Tierra.":"There is ice in craters at the lunar south pole and under the Martian soil: using it avoids launching water from Earth.","Sacar agua de lugares difíciles (niebla, humedad del aire, acuíferos profundos) es clave en zonas secas.":"Getting water from hard places (fog, air humidity, deep aquifers) is key in dry regions.","Fabricar combustible allá (ISRU)":"Making fuel there (ISRU)","En Marte se puede fabricar oxígeno y combustible con el CO₂ del aire; el robot MOXIE de NASA ya fabricó oxígeno en Marte.":"On Mars, oxygen and fuel can be made from CO₂ in the air; NASA's MOXIE experiment already made oxygen on Mars.","Convertir CO₂ en combustible o materiales podría ayudar a reducir el dióxido de carbono que calienta el planeta.":"Turning CO₂ into fuel or materials could help reduce the carbon dioxide that is warming the planet.","Sin radio: la conjunción solar":"No radio: solar conjunction","Cada 26 meses el Sol queda entre la Tierra y Marte y no hay comunicación por unas dos semanas; además la radio tarda de 4 a 24 minutos.":"Every 26 months the Sun sits between Earth and Mars and there's no communication for about two weeks; radio also takes 4 to 24 minutes.","Aprender a decidir sin ayuda inmediata sirve en emergencias, en lugares sin señal y en equipos que trabajan lejos.":"Learning to decide without immediate ound.","La Estación da una vuelta cada 90 minutos.":"The Station goes around once every 90 minutes.",Electrólisis:"Electrolysis","Separar el agua en hidrógeno y oxígeno con electricidad.":"Splitting water into hydrogen and oxygen with electricity.","Así se fabrica el aire en la Estación.":"That's how air is made on the Station.","Las máquinas que hacen aire, limpian el CO₂ y reciclan el agua.":"The machines that make air, remove CO₂ and recycle water.","Si se rompe, el agua se acaba más rápido.":"If it breaks, water runs out faster.","Limpiar el sudor, la orina y el vapor para volver a beberlos.":"Cleaning sweat, urine and vapor to drink them again.","La Estación recupera 98 % del agua.":"The Station recovers 98 % of its water.","EVA (salida al exterior)":"EVA (spacewalk)","Salir de la nave con traje espacial para trabajar afuera.":"Leaving the ship in a spacesuit to work outside.","Siempre en pareja y con pre-respiración.":"Always in pairs and with pre-breathing.","Pre-respiración":"Pre-breathing","Respirar oxígeno puro antes de salir para no enfermarse por el cambio de presión.":"Breathing pure oxygen before going out so the pressure change doesn't make you sick.","Como los buzos que suben despacio.":"Like divers who come up slowly.","Go/No-Go":"Go/No-Go","Cada persona responsable dice si está lista (GO) o no (NO GO).":"Each responsible person says whether they are ready (GO) or not (NO GO).","Si alguien dice NO GO, se espera.":"If someone says NO GO, everyone waits.",Radiación:"Radiation","Partículas invisibles del Sol y del espacio que dañan el cuerpo.":"Invisible particles from the Sun and space that harm the body.","Se mide en milisievert (mSv).":"It's measured in millisieverts (mSv).","Una explosión del Sol que lanza muchas partículas.":"An explosion on the Sun that throws out lots of particles.","Hay que ir al refugio.":"You have to go to the shelter.","El polvo y las piedritas del suelo de la Luna o Marte.":"The dust and pebbles on the ground of the Moon or er on Mars","Atrapa las cosas que flotan en la cabina antes de que se acabe el tiempo.":"Catch the things floating in the cabin before time runs out.","Los astronautas practican la ingravidez en un avión que cae en picada: unos 25 segundos de flotar en cada subida.":"Astronauts practice weightlessness in a plane that dives: about 25 seconds of floating on each climb.","Mantén la cruz en el centro del puerto mientras la nave se acerca.":"Keep the crosshair centered on the port while the ship moves in.","Las naves llegan a la Estación a unos 10 cm por segundo, más lento que una persona caminando.":"Ships reach the Station at about 10 cm per second, slower than a person walking.","Toca AGARRAR cuando la pinza esté justo encima de la nave de carga.":"Tap GRAB when the claw is right above the cargo ship.","El brazo Canadarm2 mide 17 metros y atrapa naves de carga que flotan junto a la Estación.":"The Canadarm2 arm is 17 meters long and catches cargo ships floating next to the Station.","Salta los cráteres. En la Luna pesas 6 veces menos: los saltos son largos y lentos.":"Jump over the craters. On the Moon you weigh 6 times less: jumps are long and slow.","Los astronautas del Apolo avanzaban dando saltitos de canguro porque caminar normal era más difícil.":"Apollo astronauts moved with kangaroo hops because walking normally was harder.","Programa al rover con órdenes y envíalas. La señal tarda en llegar a Marte: piensa todo el camino antes.":"Program the rover with commands and send them. The signal takes time to reach Mars: plan the whole path first.","Una señal tarda entre 4 y 24 minutos en llegar a Marte. Por eso los rovers no se manejan en vivo: se les manda el plan del día.":"A signal takes 4 to 24 minutes to reach Mars. That's why rovers aren't driven live: they get the plan for the day.","Mantén la aguja en la zona verde: toca TENSAR para aguantar la fuerza G, sin pasarte.":"Keep the needle in the green zone: hold STRAIN to resist the G force, without overdoing it. ado iluminado para pasar el eclipse sin apagar el soporte vital.","Almacenar energía permite usar sol y viento de noche o sin viento, y mantener hospitales con luz en apagones."),ta("racionamiento","Racionamiento","Con suministros limitados, la tripulación calcula consumos diarios de agua, comida y oxígeno y ajusta antes de quedarse corta.","Planificar y medir el consumo ayuda a hogares y comunidades a sobrevivir sequías, escasez y emergencias."),ta("ejercicio_hueso","Ejercicio y huesos","Sin gravedad los huesos y músculos se debilitan, así que se entrena unas 2 horas al día con máquinas especiales.","Lo aprendido sobre pérdida ósea sirve para entender la osteoporosis y la recuperación de personas con poco movimiento."),ta("radiacion_protector","Radiación y protector solar","Fuera de la protección de la atmósfera la radiación se acumula, y por eso se vigila la dosis de cada persona. Medidas reales: unos 0,5 mSv por día en la estación, 1,4 en la superficie de la Luna (sonda Chang'E-4) y 0,64 en Marte (rover Curiosity). NASA pone un límite de 600 mSv en toda la carrera de un astronauta.","En la Tierra el protector solar, la sombra y evitar el sol fuerte reducen el daño de la radiación ultravioleta en la piel."),ta("purificador_aire","Purificadores de aire","Se retira el CO₂ que exhala la tripulación y se repone oxígeno, o todos se intoxicarían en cuarto cerrado.","Filtrar y ventilar mejora el aire de aulas, oficinas y hospitales, donde el CO₂ alto da sueño y falta de concentración."),ta("satelites_clima","Satélites y clima","Las cámaras e instrumentos en órbita observan nubes, océanos y hielo de todo el planeta de forma continua.","Esos datos alimentan los pronósticos, alertas de huracanes e incendios y el seguimiento del cambio climático."),ta("gps","GPS","Una constelación de satélites con relojes muy precisos permite calcular la posición desde cualquier punto.","El GPS guía vehículos, barcos y aviones, ayuda a rescates y sincroniza redes eléctricas y bancos."),ta("g
